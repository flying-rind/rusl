[package]
name = "rusl-thread"
version = "0.1.0"
edition = "2021"
description = "rusl thread module — POSIX threads (pthread) and C11 threads"

[lib]
crate-type = ["lib", "staticlib"]
doctest = false
test = true

[features]
default = ["rusl"]
rusl = [
    "dep:rusl-internal",
    "dep:rusl-malloc",
    "dep:rusl-unistd",
    "dep:rusl-string",
    "dep:rusl-stdio",
    "dep:rusl-errno",
]

[dependencies]
rusl-core = { path = "../rusl-core", features = ["rusl"] }
rusl-syscall = { path = "../rusl-syscall" }
rusl-string = { path = "../rusl-string", optional = true }
rusl-internal = { path = "../rusl-internal", optional = true }
rusl-malloc = { path = "../rusl-malloc", optional = true }
rusl-unistd = { path = "../rusl-unistd", optional = true }
rusl-stdio = { path = "../rusl-stdio", optional = true }
rusl-errno = { path = "../rusl-errno", optional = true }

[profile.dev]
panic = "abort"

[profile.test]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
